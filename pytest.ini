[pytest]
testpaths = tests
pythonpath = src
addopts = -m "not requires_data and not slow"
markers =
    requires_data: needs the real MIT-BIH database on disk (skipped by default)
    slow: trains real networks; minutes not seconds (skipped by default).
        Run before accepting any change to losses.py, train.py or the model:
        pytest tests/test_imbalance_regression.py -m slow
filterwarnings =
    error::RuntimeWarning
