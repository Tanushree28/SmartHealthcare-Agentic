# MIMIC-III clinical prediction task.
#
# Read by scripts/mimic_iii/*.py. The defaults in src/mimic_iii/config.py
# (TaskSpec) hold the same values; tests/mimic_iii/test_config.py fails if the
# two drift apart. Change a value here only together with PlanDoc, because it
# changes the task every reported number refers to.

[task]
name = "cardiac_icu_in_hospital_mortality_24h"
target = "in_hospital_mortality"

# Cohort
min_age = 18.0
age_over_89_value = 91.4          # MIMIC-III shifts DOB for >89; recode to the group's median
first_stay_only = true
cardiac_icd9_prefixes = ["410", "411", "412", "414", "427", "428"]

# Timing. Index time = ICU intime + observation_hours. Only data recorded
# strictly before the index time is used.
observation_hours = 24.0
lab_lookback_hours = 6.0          # labs from intime - 6 h

# Patient-level split by SUBJECT_ID, stratified on the label.
split_fractions = [0.7, 0.15, 0.15]
split_seed = 20261014

[model]
# L2 logistic regression. C chosen on the validation split by AUPRC; the
# decision threshold chosen on the validation split by the rule below.
C_grid = [0.01, 0.1, 1.0, 10.0]
class_weight = "balanced"
max_iter = 5000
threshold_rule = "youden"         # or "max_f1"
n_bootstrap = 1000
